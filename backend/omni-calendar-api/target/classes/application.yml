spring:
  application:
    name: omni-calendar-api

  datasource:
    url: jdbc:mysql://localhost:3306/omni_calendar?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "2319!@#MySQL"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production-must-be-at-least-256-bits}
  expiration: 86400000  # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

firebase:
  config-file: ${FIREBASE_CONFIG:classpath:firebase-service-account.json}

logging:
  level:
    com.omnicalendar: DEBUG
    org.springframework.security: INFO
